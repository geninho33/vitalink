server {
    listen 80;
    server_name _;

    # Em HTTP puro o navegador alerta sobre senha; redireciona para HTTPS quando disponível.
    # Se HTTPS não estiver ativo no mesmo host, o location /api ainda funciona em HTTP.
    location /api/ {
        include /etc/nginx/proxy_api.inc;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/vitalink.crt;
    ssl_certificate_key /etc/nginx/certs/vitalink.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        include /etc/nginx/proxy_api.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
