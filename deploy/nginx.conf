server {
    listen 80;
    server_name _;

    # Diagnóstico: Nginx → backend /health (não exige porta 3002 no host)
    location = /api-health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vl_upstream vitalink-backend:3333;
        proxy_pass http://$vl_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vl_upstream vitalink-backend:3333;
        # $request_uri é obrigatório com variável (senão o path pode ser perdido / 502)
        proxy_pass http://$vl_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/vitalink.crt;
    ssl_certificate_key /etc/nginx/certs/vitalink.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /api-health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vl_upstream vitalink-backend:3333;
        proxy_pass http://$vl_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $vl_upstream vitalink-backend:3333;
        proxy_pass http://$vl_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
