# VitaLink — orquestração Docker
# Portas host: DB 5433 | API 3002 | Web HTTP 3102 | Web HTTPS 3443
name: vitalink

services:
  vitalink-db:
    image: ${VITALINK_PG_IMAGE:-postgres:16-alpine}
    container_name: vitalink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vitalink}
      POSTGRES_USER: ${DB_USER:-vitalink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vitalink_secret}
    ports:
      - "${VITALINK_DB_HOST_PORT:-5433}:5432"
    volumes:
      - vitalink_pg_data:/var/lib/postgresql/data
      - ../database/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      vitalink-net:
        aliases:
          - vitalink-db

  vitalink-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: vitalink-backend:latest
    container_name: vitalink-backend
    restart: unless-stopped
    depends_on:
      vitalink-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3333}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DB_HOST: vitalink-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-vitalink}
      DB_PASSWORD: ${DB_PASSWORD:-vitalink_secret}
      DB_NAME: ${DB_NAME:-vitalink}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-vitalink-2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${VITALINK_BACKEND_HOST_PORT:-3002}:3333"
    volumes:
      - vitalink_uploads:/app/uploads
    healthcheck:
      # /health não depende do DB — sobe assim que o Node escuta a porta
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3333/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    networks:
      vitalink-net:
        aliases:
          - vitalink-backend

  vitalink-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: vitalink-frontend:latest
    container_name: vitalink-frontend
    restart: unless-stopped
    depends_on:
      vitalink-backend:
        condition: service_healthy
    ports:
      - "${VITALINK_FRONTEND_HOST_PORT:-3102}:80"
      - "${VITALINK_FRONTEND_HTTPS_HOST_PORT:-3443}:443"
    networks:
      vitalink-net:
        aliases:
          - vitalink-frontend

volumes:
  vitalink_pg_data:
    name: vitalink_pg_data
  vitalink_uploads:
    name: vitalink_uploads

networks:
  vitalink-net:
    name: vitalink-net
    driver: bridge
