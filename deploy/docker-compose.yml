# VitaLink — orquestração Docker
# Portas host: DB 5433 | API 3002 | Web HTTP 3102 | Web HTTPS 3443
name: vitalink

services:
  vitalink-db:
    image: ${VITALINK_PG_IMAGE:-postgres:16-alpine}
    container_name: vitalink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      # DB_PASSWORD deve ser configurado no .env com valor forte
      # Nunca use valores padrão em produção!
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERRO: DB_PASSWORD não definido no .env}"
    ports:
      - "${VITALINK_DB_HOST_PORT:-5433}:5432"
    volumes:
      - vitalink_pg_data:/var/lib/postgresql/data
      - ../database/schema.postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      vitalink-net:
        aliases:
          - vitalink-db

  vitalink-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: vitalink-backend:latest
    container_name: vitalink-backend
    restart: unless-stopped
    depends_on:
      vitalink-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Porta INTERNA fixa — não use BACKEND_PORT/.env para isto.
      # Host público: VITALINK_BACKEND_HOST_PORT (ex.: 3002→3333).
      PORT: "3333"
      API_PREFIX: ${API_PREFIX:-/api/v1}
      DB_HOST: vitalink-db
      DB_PORT: 5432
      DB_USER: ${APP_DB_USER:-${DB_USER}}
      DB_PASSWORD: ${APP_DB_PASSWORD:-${DB_PASSWORD}}
      DB_NAME: ${DB_NAME}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_REDE_SAUDE: ${SEED_REDE_SAUDE:-true}
      UPLOAD_DIR: /app/uploads
      # JWT_SECRET deve ser configurado no .env com valor forte (min. 32 chars)
      # Nunca use valores padrão em produção!
      JWT_SECRET: "${JWT_SECRET:?ERRO: JWT_SECRET não definido no .env}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # CORS_ORIGIN deve listar explicitamente as origens permitidas
      # Em produção, NUNCA use wildcard (*)
      CORS_ORIGIN: "${CORS_ORIGIN:?ERRO: CORS_ORIGIN não definido no .env}"
      # Rate limiting
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-1000}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-5}
      RATE_LIMIT_SENSITIVE: ${RATE_LIMIT_SENSITIVE:-3}
      # Trust proxy
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    ports:
      - "${VITALINK_BACKEND_HOST_PORT:-3002}:3333"
    volumes:
      - vitalink_uploads:/app/uploads
    healthcheck:
      # /health não depende do DB — sobe assim que o Node escuta a porta
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3333/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    networks:
      vitalink-net:
        aliases:
          - vitalink-backend

  vitalink-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        # Sempre relativo: HTTPS (homolog) → mesmo origin via Nginx /api/
        # Valores http://IP:porta no .env causam Mixed Content no browser.
        VITE_API_URL: /api/v1
    image: vitalink-frontend:latest
    container_name: vitalink-frontend
    restart: unless-stopped
    depends_on:
      vitalink-backend:
        condition: service_healthy
    ports:
      - "${VITALINK_FRONTEND_HOST_PORT:-3102}:80"
      - "${VITALINK_FRONTEND_HTTPS_HOST_PORT:-3443}:443"
    networks:
      vitalink-net:
        aliases:
          - vitalink-frontend

volumes:
  vitalink_pg_data:
    name: vitalink_pg_data
  vitalink_uploads:
    name: vitalink_uploads

networks:
  vitalink-net:
    name: vitalink-net
    driver: bridge
